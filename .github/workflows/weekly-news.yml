# 이번주 원우 소식 카톡 초안 (2026-09-24) — 매주 월요일 18:00(한국 시간)에 앱의 /api/news/weekly-close를 부릅니다.
# 이번 주(화~월) 원우 소식 화면 링크로 카톡 채널 초안을 만들고 운영진에게 알립니다. 자세한 건 그 route.ts 주석.
#
# 저장소 Settings → Secrets and variables → Actions에 NEWS_CRON_TOKEN이 있어야 합니다
# (Secret Manager의 NEWS_CRON_TOKEN과 같은 값). Actions 탭 → 이 작업 → "Run workflow"로 바로 돌려 볼 수 있습니다.
# ★ GitHub 예약 실행은 몇 분~수십 분 늦게 돌 수 있습니다(사람이 많은 정각엔 더). 월요일 안에만 돌면 결과는 같습니다.
name: weekly-news

on:
  schedule:
    - cron: "0 9 * * 1" # UTC 월요일 09:00 = 한국 월요일 18:00
  workflow_dispatch: {}

jobs:
  close-week:
    runs-on: ubuntu-latest
    steps:
      - name: 지난주 원우 소식 마감
        env:
          NEWS_CRON_TOKEN: ${{ secrets.NEWS_CRON_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "x-cron-token: $NEWS_CRON_TOKEN" \
            https://aegiaeta.web.app/api/news/weekly-close
