# Firebase App Hosting 설정 (백엔드 agikaeta, asia-east1 → https://aegiaeta.web.app)
# 2026-09-22에 새 컴퓨터에서 다시 만들었습니다(예전 컴퓨터의 것은 저장소에 없었습니다).
#
# NEXT_PUBLIC_ 값은 빌드 때 코드에 박혀 브라우저로 나가는 공개값입니다(Firebase 웹 설정 등).
# 진짜 비밀값은 여기 적지 않고 Secret Manager에 두고 이름만 가리킵니다(secret:).
#   새 비밀값: firebase.cmd apphosting:secrets:set 이름 --project aegiaeta10
#   ★ 그 명령이 이 파일을 다시 써서 긴 값을 두 줄로 쪼갤 수 있습니다. 쪼개지면 한 줄로 되돌리세요 —
#     scripts/setup-env.mjs가 한 줄씩 읽습니다.

runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDM49nwo28yNwiOqGjaZOWgUWrVs-ysglw"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "aegiaeta10.firebaseapp.com"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "aegiaeta10"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "aegiaeta10.firebasestorage.app"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "152610870355"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:152610870355:web:096b2c0b25a3240746a2a6"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
    value: "qz4f4bh5"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET
    value: "aegiaeta10"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: "BEFzswFhCNhyn363Na0lAygPAcHJFzn_SK0nKeLfj-cOUk7-TOAiLDRKYitURavtAkYW6nOAvFCloW76oE64DQA"
    availability: [ BUILD, RUNTIME ]
  - variable: FIREBASE_SERVICE_ACCOUNT
    secret: FIREBASE_SERVICE_ACCOUNT
    availability: [ RUNTIME ]
  # 카카오 로그인 (2026-09-22 켬). REST API 키는 동의 화면 주소에 드러나는 공개값입니다.
  - variable: NEXT_PUBLIC_KAKAO_REST_API_KEY
    value: "5b6cba6f994d75a6ad43e22c167bfaac"
    availability: [ BUILD, RUNTIME ]
  # Client Secret(카카오 로그인 → 보안). 비밀값이라 Secret Manager에만 있습니다.
  - variable: KAKAO_CLIENT_SECRET
    secret: KAKAO_CLIENT_SECRET
    availability: [ RUNTIME ]
