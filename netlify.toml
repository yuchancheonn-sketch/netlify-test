# Netlify 배포 설정
# ------------------------------------------------------------------
# Netlify가 Next.js를 알아서 감지하긴 하지만, 빌드 방식이 사람 손에 따라
# 달라지지 않도록 여기에 못박아 둡니다.
#
# 중요: NEXT_PUBLIC_ 으로 시작하는 값들은 "빌드할 때" 코드 안에 박힙니다.
# 그래서 Netlify 사이트 설정(Environment variables)에 6개 값을 넣어야 하고,
# 값을 바꾼 뒤에는 반드시 다시 배포(Deploy)해야 반영됩니다.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16은 Node 20.9 이상이 필요합니다.
  NODE_VERSION = "22"

  # Netlify는 환경변수 값이 빌드 결과물에서 발견되면 "비밀값이 새어나갔다"고 보고
  # 배포를 실패시킵니다. 하지만 NEXT_PUBLIC_ 값들은 원래 브라우저 코드에 박히는 게
  # 정상이고(Firebase 웹 설정값은 공개되는 값입니다), 실제 접근 제어는
  # firestore.rules가 담당합니다. 그래서 이 값들은 검사에서 빼줍니다.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET"

# Next.js 런타임 (App Router·서버 렌더링·이미지 최적화 처리)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 비공개 커뮤니티 앱이므로 검색엔진에 잡히지 않게 합니다.
# (앱 코드에서도 robots 메타태그로 한 번 더 막고 있습니다.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    # 다른 사이트가 이 앱을 iframe으로 감싸는 것을 막습니다.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
